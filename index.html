<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Makanak Control</title>

  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #07130f, #0f241b);
      color: white;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 430px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(14px);
    }

    h1 {
      margin: 0;
      font-size: 38px;
      letter-spacing: 2px;
    }

    .subtitle {
      color: #9fb0a9;
      margin-top: 6px;
      margin-bottom: 24px;
    }

    .status {
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 18px;
      background: rgba(255, 255, 255, 0.06);
      font-weight: bold;
    }

    .connected {
      color: #42df91;
    }

    .disconnected {
      color: #ff6258;
    }

    button {
      width: 100%;
      padding: 17px;
      margin-top: 12px;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.15s;
    }

    button:active {
      transform: scale(0.98);
    }

    .available {
      background: #42d995;
      color: #07140d;
    }

    .reserve {
      background: #ff5c52;
      color: white;
    }

    .alert {
      background: #ffb347;
      color: #1b1204;
    }

    .stop {
      background: #4285f4;
      color: white;
    }

    .last-command {
      margin-top: 18px;
      font-size: 14px;
      color: #9aa7a1;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>MAKANAK</h1>
    <div class="subtitle">Smart Parking Remote Control</div>

    <div id="connectionStatus" class="status disconnected">
      Connecting to EMQX...
    </div>

    <button class="available" onclick="sendCommand('AVAILABLE')">
      AVAILABLE
    </button>

    <button class="reserve" onclick="sendCommand('RESERVE')">
      RESERVE
    </button>

    <button class="alert" onclick="sendCommand('ALERT')">
      TEST ALERT
    </button>

    <button class="stop" onclick="sendCommand('STOP')">
      STOP ALERT
    </button>

    <div id="lastCommand" class="last-command">
      Waiting for command...
    </div>

  </div>

  <script>
    // =========================
    // EMQX SETTINGS
    // =========================

    const broker =
      "wss://q0f46e44.ala.asia-southeast1.emqxsl.com:8084/mqtt";

    const mqttUsername = "makanak";
    const mqttPassword = "123123";

    const commandTopic =
      "makanak/test/command";

    // =========================
    // MQTT CONNECTION
    // =========================

    const client = mqtt.connect(
      broker,
      {
        username: mqttUsername,
        password: mqttPassword,

        clientId:
          "MakanakWeb-" +
          Math.random()
            .toString(16)
            .substring(2),

        clean: true,

        connectTimeout: 5000,

        reconnectPeriod: 2000
      }
    );

    // =========================
    // CONNECTED
    // =========================

    client.on("connect", function () {

      const status =
        document.getElementById(
          "connectionStatus"
        );

      status.textContent =
        "● EMQX CONNECTED";

      status.className =
        "status connected";
    });

    // =========================
    // OFFLINE
    // =========================

    client.on("offline", function () {

      const status =
        document.getElementById(
          "connectionStatus"
        );

      status.textContent =
        "● DISCONNECTED";

      status.className =
        "status disconnected";
    });

    // =========================
    // ERROR
    // =========================

    client.on("error", function (error) {

      console.error(
        "MQTT Error:",
        error
      );

      const status =
        document.getElementById(
          "connectionStatus"
        );

      status.textContent =
        "EMQX CONNECTION ERROR";

      status.className =
        "status disconnected";
    });

    // =========================
    // SEND COMMAND
    // =========================

    function sendCommand(command) {

      if (!client.connected) {

        alert(
          "MQTT is not connected yet."
        );

        return;
      }

      client.publish(
        commandTopic,
        command,
        {
          qos: 0
        }
      );

      document.getElementById(
        "lastCommand"
      ).textContent =
        "Last command: " +
        command;

      console.log(
        "Sent:",
        command
      );
    }
  </script>

</body>
</html>
